# Blueprint Render — portfolio BenDev.
# Deux services : l'API Django et le front Next.js, créés d'un seul coup
# depuis dashboard.render.com → New → Blueprint.

databases:
  - name: bendev-db
    databaseName: bendev
    user: bendev
    plan: free

services:
  # --- API Django + administration ------------------------------------
  - type: web
    name: bendev-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/site/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: bendev-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.13.1"
      # Compte administrateur créé au premier build (l'offre gratuite
      # n'ouvre pas de shell). À renseigner dans le dashboard.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  # --- Front Next.js ---------------------------------------------------
  - type: web
    name: bendev-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      # Render fournit l'hôte sans protocole : resolveApiUrl() complète
      # en https. Aucune URL à recopier à la main.
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: bendev-api
          property: host
      - key: NODE_VERSION
        value: "22.22.0"
